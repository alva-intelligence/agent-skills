# TEMPLATE: .github/workflows/review.yml
#
# Renders into: <target-repo>/.github/workflows/review.yml
#
# Placeholders to fill:
#   {{RUNNER_LABEL}}              e.g. frndos-pr-review (load-bearing label
#                                 only the central self-hosted runner advertises)
#   {{RUNNER_SCRIPT_PATH}}        e.g. /var/www/pr-review.frndos.internal/bin/pr-review.sh
#   {{LARK_SCRIPT_PATH}}          e.g. /var/www/pr-review.frndos.internal/bin/lark-notify.sh
#   {{TIMEOUT_MINUTES}}           e.g. 20
#   {{STACK_SPECIFIC_IGNORES}}    YAML-list lines (each "      - 'path/**'") for
#                                 stack-specific paths-ignore patterns. Pull from
#                                 stack-profiles.md "Workflow ignore patterns"
#                                 section. Empty string OK if stack has none.
#
# Strip THIS comment block before writing — keep the workflow's own inline
# comments though (they're load-bearing for future maintainers).

name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    # Skip review when PR ONLY touches non-code paths. Mixed PRs (code + doc)
    # still run. Lockfiles + migrations + config kept — supply-chain + auth
    # checks need them.
    paths-ignore:
      # Docs / non-code (agnostic)
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG*'
      - 'LICENSE*'
      - '.editorconfig'
      # Git / IDE meta (agnostic)
      - '.gitignore'
      - '.gitattributes'
      - '.vscode/**'
      - '.idea/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/CODEOWNERS'
      # Binary assets (agnostic)
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '**.ico'
      - '**.webp'
      - '**.woff'
      - '**.woff2'
      - '**.ttf'
      - '**.otf'
      - '**.pdf'
      # Stack-specific patterns added by skill per stack-profiles.md
{{STACK_SPECIFIC_IGNORES}}

# Avoid stacking reviews when a PR gets several pushes in quick succession.
concurrency:
  group: claude-pr-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts; the bot reviews when the PR is ready.
    if: github.event.pull_request.draft == false

    # Routes the job to our self-hosted runner. The `{{RUNNER_LABEL}}` label
    # is the load-bearing piece — only our runner advertises it.
    runs-on: [self-hosted, linux, {{RUNNER_LABEL}}]

    # GITHUB_TOKEN is unused by the script (we use the bot's gh auth on the
    # server), but keeping permissions minimal is defense in depth.
    permissions:
      contents: read
      pull-requests: read

    timeout-minutes: {{TIMEOUT_MINUTES}}

    steps:
      - name: Run Claude review pipeline
        env:
          PR_REPO:     ${{ github.repository }}
          PR_NUMBER:   ${{ github.event.pull_request.number }}
          PR_TITLE:    ${{ github.event.pull_request.title }}
          PR_URL:      ${{ github.event.pull_request.html_url }}
          PR_AUTHOR:   ${{ github.event.pull_request.user.login }}
          PR_BASE:     ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        # Worker posts the two PR comments AND prints the summary JSON on stdout.
        # We capture stdout and hand it to the Lark notifier in the next step.
        run: |
          set -euo pipefail
          {{RUNNER_SCRIPT_PATH}} \
            | tee "${RUNNER_TEMP}/review-summary.json"

      - name: Notify Lark
        # Always notify — even "no feedback" runs produce a card so the team
        # sees the PR was looked at. Failure of this step does not fail the run.
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -s "${RUNNER_TEMP}/review-summary.json" ]; then
            {{LARK_SCRIPT_PATH}} \
              < "${RUNNER_TEMP}/review-summary.json"
          else
            echo "No summary JSON produced; skipping Lark notify."
          fi
